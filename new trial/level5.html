<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolf Click Game</title>
    <link rel="stylesheet" href="assets/level5styles.css">
</head>
<body>
    <div id="intro-screen">
        <h2>Game Instructions</h2>
        <p>You need to continuously click on the wolf icon to reduce the danger meter. If the danger reaches 100%, you lose!</p>
        <button id="start-btn">Start Game</button>
    </div>
    <div id="game-container" style="display: none;">
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="timer">Time Left: 60:00</div>
        <img id="wolf" src="assets/images/wolves.png" alt="Wolf">
        <audio id="alert-sound" src="assets/audio/wolf_howl.mp3"></audio>
        <button id="next-level-btn" onclick="window.location.href='level6.html'" style="display: none; margin: 20px auto; padding: 10px 20px; font-size: 16px;">Next Level</button>
    </div>
    <script src="assets/level5scripts.js"></script>
</body>
</html>
